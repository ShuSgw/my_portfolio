name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Gatsby site
        run: npm run build

      - name: Deploy over rsync/SSH
        uses: burnett01/rsync-deployments@8.0.0
        with:
          switches: -avzr --delete --exclude=.well-known/
          path: public/
          remote_path: /home/u303929511/domains/shagawa.work/public_html/
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.HOSTINGER_ACTION_DEPLOY_KEY }}
