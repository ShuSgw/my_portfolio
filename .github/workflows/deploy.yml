name: Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Gatsby site
        run: npm run build
        env:
          # Basic auth for /cv/ — consumed by gatsby-node.js onPostBuild.
          CV_BASIC_AUTH_HTPASSWD: ${{ secrets.CV_BASIC_AUTH_HTPASSWD }}
          CV_BASIC_AUTH_USERFILE_PATH: /home/u985674127/domains/shagawa.work/public_html/cv/.htpasswd
          # Google Analytics (GA4) — consumed by gatsby-config.js.
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          # Google Search Console verification token — consumed by gatsby-ssr.js.
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_ACTION_DEPLOY_KEY }}

      - name: Add host to known_hosts
        run: ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            --exclude=.well-known/ \
            --exclude=cv/shagawa_cv.pdf \
            public/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u985674127/domains/shagawa.work/public_html/
